[module/rofi]
type=custom/text
content=""
content-padding= 2
click-left= exec rofi -show drun -disable-history -show-icons
click-right= exec ~/.config/custom_scripts/power.sh
content-foreground=${custom-red-theme.background}
content-background=${custom-red-theme.primary}

[module/wsc]
type = custom/script
exec = ~/.config/polybar/ws-xwindow.fish
interval = 1
format-underline = ${custom-red-theme.accent}

[module/xwindow]
type = internal/xwindow
format-prefix="[]"
format-prefix-foreground=${custom-red-theme.accent}
format-underline=${custom-red-theme.accent}
label = %class%
label-maxlen = 60
label-foreground = ${custom-red-theme.accent}
label-padding-left=2
label-padding-right=2

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/ws.fish
interval = 1
format-underline= ${custom-red-theme.accent}

[module/net]
type = internal/network
interface = eth0
format-prefix="[]"
format-down = "⇩ %down%B"
format-up = "⇧ %up%B"
interval = 3
label-foreground = ${custom-red-theme.secondary}
label-padding = 2

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
fuzzy-match = true

ws-icon-0 = 1;󰎤
ws-icon-1 = 2;󰎧
ws-icon-2 = 3;󰎪
ws-icon-3 = 4;󰎭
ws-icon-4 = 5;󰎱
ws-icon-5 = 6;󰎳
ws-icon-6 = 7;󰎶
ws-icon-7 = 8;󰎹

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${custom-red-theme.accent}
label-mode-foreground = ${custom-red-theme.foreground}

label-focused = %icon%
label-focused-font = 5
label-focused-foreground = ${custom-red-theme.primary}
label-focused-padding = 1

label-unfocused = %icon%
label-unfocused-font = 5
label-unfocused-foreground = ${custom-red-theme.foreground}
label-unfocused-padding = 1

label-visible = %icon%
label-visible-padding = 1

label-urgent = %icon%
label-urgent-font = 5
label-urgent-foreground = ${custom-red-theme.accent}
label-urgent-padding = 1

label-separator = ""
label-separator-padding = 1
label-separator-foreground = ${custom-red-theme.transparent}

[module/time]
type = internal/date
interval = 1
format-prefix = "[]"
format-prefix-foreground=${custom-red-theme.accent}
format-underline= ${custom-red-theme.accent}
date = %d %H:%M 
label = %date% 
label-foreground = ${custom-red-theme.accent}
label-padding-left=2
label-padding-right=2

[module/filesystem]
type = internal/fs
interval = 2
mount-0 = /
format-mounted-prefix = "[]"
format-mounted-prefix-foreground = ${custom-red-theme.accent}
format-mounted-underline=${custom-red-theme.accent}
label-mounted = %free%
label-unmounted =  %mountpoint% not mounted
label-mounted-foreground = ${custom-red-theme.accent}
label-mounted-padding-left=2
label-mounted-padding-right=2

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "[]"
format-prefix-foreground = ${custom-red-theme.primary}
format-underline= ${custom-red-theme.primary}
label = %percentage%%
label-foreground = ${custom-red-theme.foreground}
label-padding-left=2
label-padding-right=2

[module/temp]
type = internal/temperature
interval = 0.5
thermal-zone = 0
hwmon-path = /sys/class/hwmon/hwmon1/temp1_input
base-temperature = 20 
warn-temperature = 70
units = true

format =<label>
format-prefix = "[]"
format-prefix-foreground= ${custom-red-theme.accent}
format-underline=${custom-red-theme.accent}
label = %temperature-c%
label-foreground = ${custom-red-theme.accent}
label-padding-left=2
label-padding-right=2

format-warn-prefix = "  []"
format-warn-prefix-foreground= ${custom-red-theme.accent}
format-warn-prefix-background= ${custom-red-theme.accent}
label-warn = %temperature-c%
label-warn-foreground = ${custom-red-theme.accent}
label-warn-background= ${custom-red-theme.accent}
label-warn-padding-left=2
label-warn-padding-right=2

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "[]"
format-volume-prefix-foreground = ${custom-red-theme.accent}
format-volume = <label-volume>
format-volume-underline= ${custom-red-theme.accent}
label-volume = %percentage%%
label-volume-foreground= ${custom-red-theme.accent}
label-volume-padding-left=2
label-volume-padding-right=2
label-muted = [  ]  muted
label-muted-foreground = ${custom-red-theme.accent}
label-muted-underline = ${custom-red-theme.accent}
label-muted-padding=2

[module/tray]
type=internal/tray
format = <tray>
tray-spacing= 8px
format-padding=5px
format-background=${custom-red-theme.background}
tray-background = ${custom-red-theme.background}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT1
adapter = ADP1
poll-interval = 5
time-format = %H:%M

format-charging =  <animation-charging><label-charging>
format-charging-foreground = ${custom-red-theme.accent}
format-charging-underline = ${custom-red-theme.accent}
label-charging = %percentage%%
label-charging-foreground = ${custom-red-theme.foreground}
label-charging-padding= 2

format-discharging = <ramp-capacity><label-discharging>
format-discharging-foreground = ${custom-red-theme.accent}
format-discharging-underline = ${custom-red-theme.accent}
label-discharging = %percentage%%
label-discharging-foreground = ${custom-red-theme.foreground}
label-discharging-underline = ${custom-red-theme.accent}
label-discharging-padding= 2

format-full-prefix = " [] "
format-full-foreground = ${custom-red-theme.accent}
format-full-underline = ${custom-red-theme.accent}
label-full = %percentage%%
label-full-foreground = ${custom-red-theme.accent}
label-full-underline= ${custom-red-theme.accent}
label-full-padding = 2

label-low = [  BATTERY LOW ] %percentage%%
label-low-foreground = ${custom-red-theme.accent}
label-low-underline= ${custom-red-theme.accent}
label-low-padding = 2

ramp-capacity-0 = []
ramp-capacity-1 = []
ramp-capacity-2 = []
ramp-capacity-3 = []
ramp-capacity-4 = []
ramp-capacity-0-foreground = ${custom-red-theme.accent}
ramp-capacity-0-underline = ${custom-red-theme.accent}
bar-capacity-width = 10

animation-charging-0 = []
animation-charging-1 = []
animation-charging-2 = []
animation-charging-3 = []
animation-charging-4 = []
animation-charging-framerate = 750

animation-discharging-0 =[]
animation-discharging-1 =[]
animation-discharging-2 =[]
animation-discharging-3 =[]
animation-discharging-4 =[]
animation-discharging-framerate = 500

animation-low-0 = !
animation-low-1 = !!
animation-low-framerate = 200

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "[    ]"
format-prefix-foreground = ${custom-red-theme.accent}
format-underline = ${custom-red-theme.accent}
format-padding-left=2
format-padding-right=2
label = %percentage%%
label-foreground=${custom-red-theme.foreground}
label-padding-left=2
label-padding-right=2

