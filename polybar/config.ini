include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/colors.ini

[bar/i3_bar]
height = 19pt
radius = 5
dpi = 100
background = ${rosepine.surface}
foreground = ${rosepine.text}
line-size = 2pt
border-size = 3pt
border-color = ${rosepine.surface}
module-margin = 0
padding-left=8pt
padding-right=8pt
separator ="  "
separator-foreground = ${rosepine.transparent}

width    = 50%
offset-x = 25%
offset-y = 0.5%

;font-0      = "0xProto Nerd Font Mono:style=Bold:size=10"
;font-0      = "DepartureMono Nerd Font Mono:style=Bold:size=11"
font-0      = "JetBrainsMonoNL Nerd Font Mono:style=Bold:size=9"

modules-left = xwindow tray
modules-right = filesystem temp pulseaudio battery time 
cursor-click = pointer
;cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
