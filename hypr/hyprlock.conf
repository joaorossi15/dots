general {
  hide_cursor = true
  ignore_empty_input = true
}

background {
  path = ~/.config/swww/pixel/redleaves.png
}

image {
  path = ~/.face.icon
  size = 200
  rounding = -1
  border_size = 1

  position = 0, -80
  halign = center
  valign = top
}

label {
  text = Hi there, $USER :)
  color = rgba(251, 241, 199, 1)
  font_size = 50
  font_family = PxPlus IBM VGA 8x16 

  position = 0, -300
  halign = center
  valign = top
}

input-field {
  size = 250, 50
  outline_thickness = 3
  dots_size = 0.05
  dots_spacing = 0.05
  dots_center = true
  dots_rounding = 10
  outer_color = rgb(29, 32, 33)
  inner_color = rgb(251, 241, 199) 
  font_color = rgb(235, 219, 178, 1.0)
  fade_on_empty = false
  placeholder_text = <i>password here</i>
  font_family = PxPlus IBM VGA 8x16
  hide_input = true
  rounding = 15
  check_color = rgb(204, 136, 34)
  fail_color = rgb(204, 36, 29)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
  fail_transition = 0
  capslock_color = rgb(104, 157, 106)
  numlock_color = -1
  bothlock_color = -1
  invert_numlock = false
  swap_font_color = false

  position = 0, -50
  halign = center
  valign = center
}
